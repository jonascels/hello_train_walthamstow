# Fly.io config. Deploy steps are in README.md ("Deploy").
# App names are global on Fly: change this if it's taken.
app = "hello-train-walthamstow"
primary_region = "lhr" # London, close to TfL and the tablet

[build]
  dockerfile = "Dockerfile"

[env]
  LINE_ID = "weaver"
  TIMING_BRIDGE_ID = "west-ave"
  POLL_INTERVAL_S = "30"
  # TFL_APP_KEY is a secret:  fly secrets set TFL_APP_KEY=...

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: the server polls TfL continuously and holds the tablet's
  # WebSocket, so it must never be stopped for being "idle".
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
